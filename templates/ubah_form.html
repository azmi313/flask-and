<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ubah Data Buku</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✏️ Ubah Data Buku</h1>
            <p>Edit informasi buku yang sudah ada</p>
        </div>

        <div class="form-container">
            <form action="{{ url_for('ubah', id=buku[0]) }}" method="post">
                <div class="form-group">
                    <label><i>🔖</i> ID Buku</label>
                    <input type="text" name="id" value="{{ buku[0] }}" readonly>
                    <small style="color: #64748b; font-size: 11px;">ID tidak dapat diubah</small>
                </div>
                <div class="form-group">
                    <label><i>📖</i> Judul Buku</label>
                    <input type="text" name="judul" value="{{ buku[1] }}" maxlength="40" required>
                </div>
                <div class="form-group">
                    <label><i>✍️</i> Penulis</label>
                    <input type="text" name="penulis" value="{{ buku[2] }}" maxlength="25" required>
                </div>
                <div class="form-group">
                    <label><i>🏢</i> Penerbit</label>
                    <input type="text" name="penerbit" value="{{ buku[3] }}" maxlength="30" required>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn-primary">💾 Update Data</button>
                    <a href="{{ url_for('index') }}" class="btn-secondary">↩️ Batal</a>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
