<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Data Buku</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Tambah Data Buku</h1>
            <p>Isi form di bawah untuk menambahkan buku baru</p>
        </div>

        <div class="form-container">
            <form action="{{ url_for('tambah') }}" method="post">
                <div class="form-group">
                    <label><i>🔖</i> ID Buku</label>
                    <input type="text" name="id" placeholder="Contoh: B001" maxlength="4" required>
                </div>
                <div class="form-group">
                    <label><i>📖</i> Judul Buku</label>
                    <input type="text" name="judul" placeholder="Masukkan judul buku" maxlength="40" required>
                </div>
                <div class="form-group">
                    <label><i>✍️</i> Penulis</label>
                    <input type="text" name="penulis" placeholder="Masukkan nama penulis" maxlength="25" required>
                </div>
                <div class="form-group">
                    <label><i>🏢</i> Penerbit</label>
                    <input type="text" name="penerbit" placeholder="Masukkan nama penerbit" maxlength="30" required>
                </div>
                <div class="btn-group">
                    <button type="submit" class="btn-primary">💾 Simpan Data</button>
                    <a href="{{ url_for('index') }}" class="btn-secondary">↩️ Batal</a>
                </div>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
